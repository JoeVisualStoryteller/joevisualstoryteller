<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Medieval Military Systems Engineer README Banner</title>
  <desc id="desc">A cinematic vector banner blending a medieval castle war room, military command planning, and system engineering infrastructure.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.45" stop-color="#28324d"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb45c" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#d2603e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d4b2d"/>
      <stop offset="1" stop-color="#2e2119"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8892a4"/>
      <stop offset="0.55" stop-color="#354050"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2b4f"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="stone" width="80" height="48" patternUnits="userSpaceOnUse">
      <rect width="80" height="48" fill="#141a24"/>
      <path d="M0 47H80M0 23H80M40 0V23M18 24V47M65 24V47" stroke="#293344" stroke-width="2" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#sky)"/>
  <rect width="900" height="500" fill="url(#sunset)"/>
  <circle cx="115" cy="238" r="85" fill="#ffcf7a" opacity="0.75" filter="url(#softGlow)"/>

  <!-- Distant mountains -->
  <path d="M0 330 L120 210 L235 324 L365 190 L520 330 Z" fill="#202842" opacity="0.8"/>
  <path d="M170 345 L320 245 L410 335 L555 225 L720 345 Z" fill="#151d32" opacity="0.85"/>
  <path d="M0 370 C180 342 350 360 520 338 C720 310 930 335 1080 320 L1080 500 L0 500 Z" fill="#0c111e" opacity="0.9"/>

  <!-- Castle silhouette -->
  <g opacity="0.9">
    <path d="M425 225 h42 v-60 h55 v60 h40 v-95 h56 v95 h38 v-70 h55 v70 h50 v150 H425 Z" fill="#111827"/>
    <path d="M450 165 l27-35 l27 35M580 130 l28-42 l28 42M700 155 l28-36 l28 36" fill="#111827"/>
    <path d="M421 225 h355" stroke="#475569" stroke-width="3" opacity="0.35"/>
    <rect x="488" y="262" width="28" height="55" rx="12" fill="#070b13"/>
    <rect x="607" y="242" width="18" height="38" rx="8" fill="#ffb45c" opacity="0.35"/>
  </g>

  <!-- Stone wall / command room right side -->
  <rect x="1020" y="0" width="580" height="500" fill="url(#stone)" opacity="0.85"/>
  <path d="M1005 0h35v500h-35z" fill="#080c13" opacity="0.7"/>

  <!-- Banners -->
  <g filter="url(#shadow)">
    <path d="M120 80 h70 v190 l-35-28 l-35 28 Z" fill="#111827" stroke="#b58a3b" stroke-width="4"/>
    <path d="M127 92 h56 v130 l-28-19 l-28 19 Z" fill="#17203a"/>
    <path d="M145 150 c15-30 45-22 35 8 c-4 12-17 20-30 14 c-11-5-12-14-5-22z" fill="#c49a48" opacity="0.85"/>
    <path d="M1185 35 h155 v230 l-78-45 l-77 45 Z" fill="#101827" stroke="#b58a3b" stroke-width="5" opacity="0.95"/>
    <path d="M1225 95 c35-55 105-32 78 28 c-18 40-74 45-91 9 c-7-16-2-28 13-37z" fill="#c49a48" opacity="0.8"/>
  </g>

  <!-- War table -->
  <g filter="url(#shadow)">
    <path d="M110 365 C340 330 675 322 1008 358 L1135 495 H5 Z" fill="url(#table)"/>
    <path d="M170 360 C392 337 650 337 930 365 L1000 450 C700 425 395 426 105 456 Z" fill="#c7a36a" opacity="0.88"/>
    <path d="M205 388 C320 372 457 384 580 367 C720 347 815 374 934 382" fill="none" stroke="#5e4027" stroke-width="4" opacity="0.6"/>
    <path d="M198 430 C330 398 430 443 560 411 C710 374 790 420 950 405" fill="none" stroke="#5e4027" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- Map markers -->
  <g fill="#101827" opacity="0.9">
    <circle cx="295" cy="405" r="8"/><circle cx="330" cy="397" r="7"/><circle cx="365" cy="412" r="7"/>
    <circle cx="540" cy="395" r="8"/><circle cx="574" cy="384" r="7"/><circle cx="610" cy="398" r="7"/>
    <circle cx="805" cy="392" r="8"/><circle cx="838" cy="382" r="7"/><circle cx="870" cy="396" r="7"/>
  </g>
  <g stroke="#8b1e2d" stroke-width="4" stroke-linecap="round">
    <path d="M460 372 v38"/><path d="M755 365 v45"/><path d="M900 372 v35"/>
  </g>

  <!-- Commander / systems engineer knight -->
  <g transform="translate(650 95)" filter="url(#shadow)">
    <path d="M42 135 C-5 195 -25 285 -22 390 H235 C226 275 220 190 165 132 Z" fill="url(#cloak)"/>
    <path d="M40 150 C70 125 145 120 173 150 L190 325 H23 Z" fill="url(#armor)" stroke="#a7b0c0" stroke-width="3"/>
    <path d="M74 152 h70 l20 168 h-110 z" fill="#202938" opacity="0.9"/>
    <path d="M71 172 h78M61 215 h99M56 258 h108" stroke="#9aa4b8" stroke-width="3" opacity="0.45"/>
    <path d="M38 185 C-20 225 -44 288 -70 355" fill="none" stroke="#697386" stroke-width="36" stroke-linecap="round"/>
    <path d="M181 188 C225 238 239 293 268 356" fill="none" stroke="#697386" stroke-width="36" stroke-linecap="round"/>
    <circle cx="107" cy="70" r="42" fill="#bd8f65"/>
    <path d="M67 58 c18-45 75-50 102-8 c-28-8-56-1-76 12 c-10 7-17 7-26-4z" fill="#201711"/>
    <path d="M68 88 c23 24 58 27 82 2 c-7 35-65 48-82-2z" fill="#8a5f45" opacity="0.28"/>
    <path d="M52 338 c35 18 85 24 131 13" stroke="#111827" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
    <path d="M80 255 l-5 82M137 255 l8 82" stroke="#05070c" stroke-width="7" opacity="0.45"/>
    <path d="M70 132 h75 l-12 34 H84 Z" fill="#111827"/>
    <circle cx="108" cy="166" r="15" fill="#c49a48"/>
    <path d="M88 205 h42 v26 h-42zM138 205h42v26h-42z" fill="#0c111e" stroke="#6b7280" stroke-width="3"/>
  </g>

  <!-- IT / system engineering displays -->
  <g filter="url(#softGlow)">
    <rect x="1005" y="185" width="360" height="190" rx="12" fill="#06111d" stroke="#37d6ff" stroke-width="3" opacity="0.78"/>
    <path d="M1045 330 L1165 250 L1288 325 M1165 250 V210 M1165 250 L1090 292 M1165 250 L1252 286" stroke="#67e8f9" stroke-width="4" fill="none"/>
    <g fill="#67e8f9">
      <rect x="1150" y="195" width="32" height="32" rx="3"/>
      <rect x="1030" y="315" width="32" height="32" rx="3"/>
      <rect x="1272" y="310" width="32" height="32" rx="3"/>
      <rect x="1074" y="276" width="28" height="28" rx="3"/>
      <rect x="1238" y="270" width="28" height="28" rx="3"/>
    </g>
    <circle cx="1165" cy="250" r="95" fill="none" stroke="#37d6ff" stroke-width="2" opacity="0.45"/>
  </g>

  <g>
    <rect x="1378" y="55" width="190" height="118" rx="8" fill="#07111d" stroke="#29384d" stroke-width="3"/>
    <rect x="1378" y="190" width="190" height="130" rx="8" fill="#07111d" stroke="#29384d" stroke-width="3"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#9ee7ff" opacity="0.9">
      <text x="1395" y="82">$ deploy --stage prod</text>
      <text x="1395" y="105">✓ infra.plan</text>
      <text x="1395" y="128">✓ security.scan</text>
      <text x="1395" y="151">→ rollout canary</text>
      <text x="1395" y="218">api-gateway: 200</text>
      <text x="1395" y="242">proxmox-node: ok</text>
      <text x="1395" y="266">xrdp: hardened</text>
      <text x="1395" y="290">jenkins: green</text>
    </g>
    <rect x="1130" y="386" width="385" height="78" rx="10" fill="#07111d" stroke="#29384d" stroke-width="3"/>
    <g fill="#22c55e" opacity="0.75">
      <circle cx="1160" cy="410" r="5"/><circle cx="1182" cy="410" r="5"/><circle cx="1204" cy="410" r="5"/>
      <circle cx="1160" cy="435" r="5"/><circle cx="1182" cy="435" r="5"/><circle cx="1204" cy="435" r="5"/>
    </g>
    <path d="M1215 410 C1260 390 1305 475 1360 425 C1400 390 1450 444 1515 405" fill="none" stroke="#37d6ff" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- Helmet -->
  <g transform="translate(1290 338)" filter="url(#shadow)">
    <path d="M0 90 C5 20 42 0 86 0 C135 0 166 28 172 90 Z" fill="url(#armor)" stroke="#9aa4b8" stroke-width="3"/>
    <path d="M24 48 h126" stroke="#05070c" stroke-width="10" opacity="0.65"/>
    <path d="M85 4 v86" stroke="#cbd5e1" stroke-width="3" opacity="0.3"/>
  </g>

  <!-- Camp soldiers -->
  <g fill="#0a0e18" opacity="0.9">
    <path d="M230 315 h18 v48 h-18zM223 306 h32 v12 h-32z"/>
    <path d="M300 320 h18 v45 h-18zM293 311 h32 v12 h-32z"/>
    <path d="M390 305 h20 v55 h-20zM382 294 h36 v14 h-36z"/>
  </g>

  <!-- Subtle vignette -->
  <rect width="1600" height="500" fill="none" stroke="#000" stroke-width="28" opacity="0.35"/>
</svg>
