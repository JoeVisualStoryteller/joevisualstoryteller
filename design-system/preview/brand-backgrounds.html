<!DOCTYPE html><html><head><meta charset="utf-8"><title>Background textures</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); }
  .card { padding: 18px 22px; }
  .grp  { font-family: var(--font-mono); font-size: 10px; letter-spacing: .25em; color: var(--cyan); text-transform: uppercase; margin: 0 0 12px; }
  .row { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .swatch { aspect-ratio: 1.1/1; background:#08080d; position:relative; border: 1px solid var(--gold-15); }
  .grid {
    background-image:
      linear-gradient(rgba(201,162,39,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,162,39,.04) 1px, transparent 1px),
      linear-gradient(rgba(6,182,212,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(6,182,212,.025) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
  }
  .scan { background-image: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.5) 3px, rgba(0,0,0,.5) 4px); background-color:#0a0a14; }
  .vignette { background: radial-gradient(ellipse at center, #1a1a24 0%, #08080d 90%); }
  .label { position:absolute; left: 8px; bottom: 8px; font-family: var(--font-mono); font-size: 9px; color: var(--fg-4); letter-spacing: .15em; text-transform: uppercase; }
</style></head>
<body>
<div class="card">
  <p class="grp">// BACKGROUNDS — circuit grid · scanlines · vignette</p>
  <div class="row">
    <div class="swatch grid"><span class="label">grid 80/20</span></div>
    <div class="swatch scan"><span class="label">scanlines</span></div>
    <div class="swatch vignette"><span class="label">vignette</span></div>
  </div>
</div>
</body></html>
