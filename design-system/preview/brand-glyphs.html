<!DOCTYPE html><html><head><meta charset="utf-8"><title>Glyph icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); }
  .card { padding: 22px 28px; }
  .grp  { font-family: var(--font-mono); font-size: 10px; letter-spacing: .25em; color: var(--cyan); text-transform: uppercase; margin: 0 0 16px; }
  .row { display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .g { background: var(--surface); border: 1px solid var(--gold-15); padding: 14px 10px; text-align:center; }
  .glyph { font-family: var(--font-mono); font-size: 24px; color: var(--gold); line-height: 1; }
  .glyph.crimson { color: var(--crimson); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); margin-top: 8px; letter-spacing: .15em; text-transform: uppercase; }
</style></head>
<body>
<div class="card">
  <p class="grp">// GLYPH ICONS — drawn from monospace</p>
  <div class="row">
    <div class="g"><div class="glyph">▸</div><div class="name">▸ marker</div></div>
    <div class="g"><div class="glyph crimson">◆</div><div class="name">◆ bullet</div></div>
    <div class="g"><div class="glyph">→</div><div class="name">→ link</div></div>
    <div class="g"><div class="glyph">·</div><div class="name">· sep</div></div>
  </div>
</div>
</body></html>
