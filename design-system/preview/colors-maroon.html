<!DOCTYPE html><html><head><meta charset="utf-8"><title>Maroon — ceremonial accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); color: var(--fg-1); }
  .card { padding: 22px 28px; display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: center; }
  .grp  { font-family: var(--font-mono); font-size: 10px; letter-spacing: .25em; color: var(--cyan); text-transform: uppercase; margin: 0 0 12px; grid-column: 1 / -1; }
  .swatch { aspect-ratio: 1/1; background: #5d2e3e; box-shadow: 0 0 28px rgba(93,46,62,.4); display:flex; align-items:flex-end; justify-content:flex-start; padding: 12px; }
  .swatch span { font-family: var(--font-mono); font-size: 11px; color: #e0e7ef; letter-spacing: .18em; text-transform: uppercase; }
  .copy { display:flex; flex-direction:column; gap: 10px; }
  .copy .h { font-family: var(--font-display); font-weight: 700; color: #5d2e3e; font-size: 22px; letter-spacing: .2em; text-transform: uppercase; margin: 0; }
  .copy .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); letter-spacing: .18em; text-transform: uppercase; }
  .copy .rule { width: 100%; height: 1px; background: linear-gradient(to right, transparent, rgba(93,46,62,.6), transparent); }
  .alpha-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
  .alpha-row > div { aspect-ratio: 1/.6; background: #5d2e3e; }
</style></head>
<body>
<div class="card">
  <p class="grp">// MAROON \u00b7 HARROW \u00b7 RAREST ACCENT \u00b7 #5d2e3e</p>
  <div class="swatch"><span>#5d2e3e</span></div>
  <div class="copy">
    <p class="h">Ceremonial</p>
    <div class="rule"></div>
    <p class="meta">one element per surface \u00b7 featured CTA \u00b7 alert \u00b7 sigil</p>
    <div class="alpha-row">
      <div style="opacity:.12"></div>
      <div style="opacity:.30"></div>
      <div style="opacity:.60"></div>
      <div style="opacity:1"></div>
    </div>
  </div>
</div>
</body></html>
