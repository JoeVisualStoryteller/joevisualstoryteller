<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors — Surfaces" subtitle="Surface tiers + parchment" viewport="700x160" --><html><head><meta charset="utf-8"><title>Colors — Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); color: var(--fg-1); }
  .card { padding: 20px 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { display:flex; flex-direction:column; gap: 8px; }
  .chip { aspect-ratio: 1/.65; border:1px solid var(--gold-20); }
  .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--fg-1); }
  .hex  { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); }
  .grp  { font-family: var(--font-mono); font-size: 10px; letter-spacing: .25em; color: var(--cyan); text-transform: uppercase; margin: 0 0 12px; }
</style></head>
<body>
<div class="card">
  <p class="grp">// SURFACE + PARCHMENT</p>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#111118"></div><span class="name">surface</span><span class="hex">#111118</span></div>
    <div class="sw"><div class="chip" style="background:#1a1a24"></div><span class="name">raised</span><span class="hex">#1a1a24</span></div>
    <div class="sw"><div class="chip" style="background:#0a0a10"></div><span class="name">raised-2</span><span class="hex">#0a0a10</span></div>
    <div class="sw"><div class="chip" style="background:#e8e0cc"></div><span class="name">parchment</span><span class="hex">#e8e0cc</span></div>
  </div>
</div>
</body></html>
