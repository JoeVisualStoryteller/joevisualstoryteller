<!DOCTYPE html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); }
  .card { padding: 26px 28px; display:flex; flex-direction:column; gap: 18px; }
  .row { display:flex; gap: 16px; align-items:center; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing:.2em; color: var(--fg-4); text-transform: uppercase; width: 110px; }
  .btn-primary { font-family: var(--font-mono); font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); padding: 12px 28px; background: transparent; cursor: pointer; transition: all .2s; }
  .btn-primary:hover { background: var(--gold-12); box-shadow: var(--glow-gold-soft); }
  .btn-ghost { font-family: var(--font-mono); font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: var(--fg-5); border: 1px solid transparent; padding: 12px 28px; background: transparent; cursor: pointer; transition: color .2s; }
  .btn-ghost:hover { color: var(--fg-1); }
  .btn-ceremony { font-family: var(--font-mono); font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: #e8e0cc; border: 1px solid #5d2e3e; background: #5d2e3e; padding: 12px 28px; cursor: pointer; transition: all .2s; }
  .btn-ceremony:hover { background: #6b3848; box-shadow: 0 0 20px rgba(93,46,62,.4); }
  .hovered { background: var(--gold-12); box-shadow: var(--glow-gold-soft); }
</style></head>
<body>
<div class="card">
  <div class="row"><span class="lbl">Primary</span><button class="btn-primary">VIEW PROFILE</button><button class="btn-primary hovered">VIEW PROFILE</button></div>
  <div class="row"><span class="lbl">Ghost</span><button class="btn-ghost">ARSENAL →</button><button class="btn-ghost" style="color: var(--fg-1)">ARSENAL →</button></div>
  <div class="row"><span class="lbl">Ceremony</span><button class="btn-ceremony">SUMMON</button><button class="btn-ceremony" style="background:#6b3848; box-shadow: 0 0 20px rgba(93,46,62,.4);">SUMMON</button></div>
</div>
</body></html>
