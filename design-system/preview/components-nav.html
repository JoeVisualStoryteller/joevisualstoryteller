<!DOCTYPE html>
<!-- @dsCard group="Components" name="Fixed nav bar" subtitle="Wordmark + mono links" viewport="700x80" --><html><head><meta charset="utf-8"><title>Nav bar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); }
  .nav { position: relative; height: 64px; padding: 0 28px; display:flex; align-items:center; justify-content: space-between; background: rgba(8,8,13,.60); backdrop-filter: blur(4px); border-bottom: 1px solid var(--gold-30); }
  .mark { font-family: var(--font-display); font-weight: 700; color: var(--gold); letter-spacing: .25em; font-size: 18px; }
  .links { display: flex; gap: 32px; }
  .links a { font-family: var(--font-mono); font-size: 11px; color: var(--fg-4); letter-spacing: .25em; text-transform: uppercase; text-decoration: none; }
  .links a.active { color: var(--gold); }
</style></head>
<body>
<div class="nav">
  <div class="mark">JHD</div>
  <div class="links">
    <a href="#" class="active">HOME</a>
    <a href="#">ABOUT</a>
    <a href="#">SKILLS</a>
  </div>
</div>
</body></html>
