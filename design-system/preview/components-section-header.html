<!DOCTYPE html><html><head><meta charset="utf-8"><title>Section header</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); }
  .card { padding: 28px; text-align:center; }
  .eb { font-family: var(--font-mono); font-size: 11px; color: var(--cyan); letter-spacing: .25em; text-transform: uppercase; margin: 0 0 12px; }
  .row { display:flex; align-items:center; justify-content: center; gap: 16px; margin-bottom: 10px; }
  .rule { height: 1px; flex: 1; max-width: 160px; }
  h2 { margin: 0; font-family: var(--font-display); font-weight: 700; color: var(--fg-1); letter-spacing: .25em; text-transform: uppercase; font-size: 28px; }
</style></head>
<body>
<div class="card">
  <p class="eb">// IDENTIFICATION</p>
  <div class="row">
    <div class="rule" style="background: linear-gradient(to left, #c9a227, transparent);"></div>
    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" fill="#c9a227" transform="rotate(45 8 8)"/></svg>
    <div class="rule" style="background: linear-gradient(to right, #c9a227, transparent);"></div>
  </div>
  <h2>About the Operator</h2>
</div>
</body></html>
