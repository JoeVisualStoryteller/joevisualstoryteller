<!DOCTYPE html>
<!-- @dsCard group="Components" name="Skills card" subtitle="Gold banner-top + crimson bullets" viewport="700x250" --><html><head><meta charset="utf-8"><title>Skills card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); }
  .wrap { padding: 22px 26px; display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--gold-15); border-top: 2px solid var(--gold); padding: 18px 18px 16px; transition: all .25s; }
  .card.hover { transform: translateY(-3px); box-shadow: var(--glow-gold-card); }
  .eb { font-family: var(--font-mono); font-size: 11px; color: var(--cyan); letter-spacing: .2em; text-transform: uppercase; margin: 0 0 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { font-family: var(--font-sans); font-size: 13px; color: rgba(232,224,204,.80); padding: 5px 0; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 8px; }
  li:last-child { border-bottom: 0; }
  .dot { color: var(--crimson); font-size: 8px; }
</style></head>
<body>
<div class="wrap">
  <div class="card">
    <p class="eb">▸ AI Tools</p>
    <ul>
      <li><span class="dot">◆</span>ChatGPT</li>
      <li><span class="dot">◆</span>GitHub Copilot</li>
      <li><span class="dot">◆</span>Claude AI</li>
      <li><span class="dot">◆</span>Azure OpenAI</li>
    </ul>
  </div>
  <div class="card hover">
    <p class="eb">▸ Cloud Platforms</p>
    <ul>
      <li><span class="dot">◆</span>AWS</li>
      <li><span class="dot">◆</span>Microsoft Azure</li>
      <li><span class="dot">◆</span>Google Cloud</li>
    </ul>
  </div>
</div>
</body></html>
