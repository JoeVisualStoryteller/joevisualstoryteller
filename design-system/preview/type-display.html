<!DOCTYPE html><html><head><meta charset="utf-8"><title>Type — Display (Cinzel)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); color: var(--fg-1); }
  .card { padding: 22px 28px; }
  .grp  { font-family: var(--font-mono); font-size: 10px; letter-spacing: .25em; color: var(--cyan); text-transform: uppercase; margin: 0 0 14px; }
  .specimen { font-family: var(--font-display); color: var(--fg-1); text-transform: uppercase; letter-spacing: .12em; line-height: 1; margin: 0; }
  .row { display:flex; justify-content:space-between; align-items:baseline; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
  .row:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); letter-spacing: .15em; text-transform: uppercase; }
</style></head>
<body>
<div class="card">
  <p class="grp">// DISPLAY — CINZEL · all weights self-hosted</p>
  <div class="row"><p class="specimen" style="font-size:24px; font-weight:400">Joseph H. Dunn</p><span class="meta">400 · Regular</span></div>
  <div class="row"><p class="specimen" style="font-size:24px; font-weight:500">Joseph H. Dunn</p><span class="meta">500 · Medium</span></div>
  <div class="row"><p class="specimen" style="font-size:24px; font-weight:600">Joseph H. Dunn</p><span class="meta">600 · SemiBold</span></div>
  <div class="row"><p class="specimen" style="font-size:24px; font-weight:700; color: var(--gold)">Joseph H. Dunn</p><span class="meta">700 · Bold · gold</span></div>
  <div class="row"><p class="specimen" style="font-size:24px; font-weight:800">Joseph H. Dunn</p><span class="meta">800 · ExtraBold</span></div>
  <div class="row"><p class="specimen" style="font-size:24px; font-weight:900">Joseph H. Dunn</p><span class="meta">900 · Black</span></div>
</div>
</body></html>
