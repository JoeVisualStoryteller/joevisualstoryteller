<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — Section hierarchy" subtitle="Eyebrow → diamond → display → body" viewport="700x230" --><html><head><meta charset="utf-8"><title>Type — Hierarchy in use</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); }
  .card { padding: 26px 28px; }
  .stack > * + * { margin-top: 12px; }
</style></head>
<body>
<div class="card">
  <div class="stack">
    <p class="eyebrow">// IDENTIFICATION</p>
    <div class="divider-diamond">
      <svg width="14" height="14" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" fill="#c9a227" transform="rotate(45 8 8)"/></svg>
    </div>
    <h2 style="margin:0; color: var(--fg-1); font-family: var(--font-display); font-weight:700; letter-spacing:.25em; text-transform:uppercase; font-size: 28px;">About the Operator</h2>
    <p style="margin:0; color: var(--fg-3); font-family: var(--font-sans); font-size: 14px; line-height: 1.6; max-width: 60ch;">
      A battle-hardened systems engineer with over a decade of service spanning military intelligence and enterprise IT.
    </p>
  </div>
</div>
</body></html>
