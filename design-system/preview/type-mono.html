<!DOCTYPE html><html><head><meta charset="utf-8"><title>Type — Mono (JetBrains Mono)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; background: var(--void); }
  .card { padding: 22px 28px; }
  .grp  { font-family: var(--font-mono); font-size: 10px; letter-spacing: .25em; color: var(--cyan); text-transform: uppercase; margin: 0 0 16px; }
  .stack { display:flex; flex-direction:column; gap: 10px; }
  .line  { display:flex; justify-content:space-between; align-items:baseline; padding-bottom: 8px; border-bottom: 1px solid var(--hairline); }
  .line:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-4); letter-spacing: .12em; text-transform: uppercase; }
</style></head>
<body>
<div class="card">
  <p class="grp">// MONO — JETBRAINS MONO</p>
  <div class="stack">
    <div class="line"><span class="system-label">[ SYSTEM: ONLINE ]</span><span class="meta">12 · light blue · 0.30em</span></div>
    <div class="line"><span class="eyebrow">// IDENTIFICATION</span><span class="meta">12 · light blue · 0.25em</span></div>
    <div class="line"><span class="eyebrow eyebrow--danger">▸ PROFILE.LOG</span><span class="meta">12 · diamond · 0.20em</span></div>
    <div class="line"><span class="btn-label" style="color: var(--gold)">VIEW PROFILE</span><span class="meta">12 · gold · btn</span></div>
    <div class="line"><span class="meta">Years Experience</span><span class="meta">12 · fg-4 · 0.20em</span></div>
  </div>
</div>
</body></html>
