<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Portfolio" name="Portfolio UI Kit" subtitle="Full clickable recreation of the portfolio site" viewport="1280x720" -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joseph H. Dunn II — Portfolio (UI Kit Recreation)</title>
  <link rel="stylesheet" href="portfolio.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div data-screen-label="Portfolio" id="root"></div>

  <script src="content.js"></script>
  <script type="text/babel" src="Runes.jsx"></script>
  <script type="text/babel" src="KitNav.jsx"></script>
  <script type="text/babel" src="KitHero.jsx"></script>
  <script type="text/babel" src="KitSectionHeader.jsx"></script>
  <script type="text/babel" src="KitAbout.jsx"></script>
  <script type="text/babel" src="KitSkills.jsx"></script>
  <script type="text/babel" src="Deployments.jsx"></script>
  <script type="text/babel" src="Contact.jsx"></script>
  <script type="text/babel" src="KitFooter.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Nav, Hero, About, Skills, Deployments, Contact, Footer } = window.JHDKit;

    function App() {
      const [active, setActive] = useState('home');
      const data = window.JHD_CONTENT;

      const go = (id) => {
        setActive(id);
        const el = document.getElementById(id);
        if (el) window.scrollTo({ top: el.offsetTop - 64, behavior: 'smooth' });
      };

      // Track active section via scroll
      useEffect(() => {
        const sections = ['home', 'about', 'skills', 'deployments', 'contact'];
        const onScroll = () => {
          const y = window.scrollY + 120;
          let cur = 'home';
          for (const id of sections) {
            const el = document.getElementById(id);
            if (el && el.offsetTop <= y) cur = id;
          }
          setActive(cur);
        };
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      return (
        <>
          <Nav activeId={active} onNav={go} />
          <main>
            <Hero data={data.hero} onCta={go} />
            <About data={data.about} />
            <Skills data={data.skills} />
            <Deployments data={data.deployments} />
            <Contact email="jdunn0423@gmail.com" />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
